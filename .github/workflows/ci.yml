name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

      - name: Verify the app builds and exposes an OpenAPI schema
        env:
          APP_ENV: test
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-hs256-signing
          DATABASE_URL: sqlite:///./data/ci.db
          UPLOAD_DIR: ./data/uploads
        run: |
          python -c "from app.main import app; schema = app.openapi(); print(len(schema['paths']), 'paths')"

      - name: Compile all sources
        run: python -m compileall -q app

  frontend:
    name: Frontend - lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --force

      - name: Build
        run: npm run build

  docker:
    name: Backend - image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: designforge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          results="${{ needs.backend.result }} ${{ needs.frontend.result }} ${{ needs.docker.result }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::CI failed"
              exit 1
            fi
          done